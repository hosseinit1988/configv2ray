<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>V2Ray Config Hub - Hossein.IT</title>
    
    <!-- Font Awesome با چند تا CDN پشتیبان (فال‌بک) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
    <!-- CDN جایگزین برای اطمینان -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* فونت وزیر رو فقط روی متن‌ها اعمال کن، روی آیکون‌ها نه! */
        body, 
        button:not(.theme-toggle):not(.filter-btn):not(.btn-copy):not(.btn-qr):not(.load-more-btn),
        .stat-badge,
        .date-persian,
        .title-section h1,
        .title-section p,
        footer,
        .config-header span:not(.protocol-icon),
        .loading,
        .close-modal,
        .qr-modal-content h3 {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif !important;
        }
        
        /* برای دکمه‌هایی که آیکون دارن، فونت سیستمی بهتر کار میکنه */
        .theme-toggle, .filter-btn, .btn-copy, .btn-qr, .load-more-btn, .btn-refresh {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif !important;
        }
        
        /* آیکون‌های Font Awesome رو دستکاری نکن */
        i, .fas, .far, .fab {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
            font-style: normal;
        }

        body {
            transition: background-color 0.3s ease, color 0.2s ease;
            padding: 20px;
            min-height: 100vh;
        }

        /* ========== تم لایت ========== */
        body.light {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f5 100%);
            color: #1e293b;
        }

        body.light .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(57, 177, 209, 0.25);
            box-shadow: 0 15px 35px rgba(57, 177, 209, 0.1);
        }

        body.light .config-item {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(57, 177, 209, 0.2);
        }

        body.light .stat-badge {
            background: rgba(57, 177, 209, 0.15);
            color: #0f5b6e;
        }

        /* ========== تم دارک (پیشفرض) ========== */
        body.dark {
            background: linear-gradient(135deg, #0f172a 0%, #1a2a3a 100%);
            color: #e2e8f0;
        }

        body.dark .card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(57, 177, 209, 0.3);
        }

        body.dark .config-item {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(57, 177, 209, 0.25);
        }

        body.dark .stat-badge {
            background: rgba(57, 177, 209, 0.2);
            color: #7dd3fc;
        }

        body.dark .btn-copy {
            background: rgba(57, 177, 209, 0.2);
            color: #e2e8f0;
        }

        body.dark .config-link {
            background: rgba(57, 177, 209, 0.1);
            color: #cbd5e1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* هدر */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #39B1D1, #D6FB61, #F6850C);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title-section p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .theme-toggle {
            background: rgba(57, 177, 209, 0.25);
            border: none;
            border-radius: 50px;
            width: 48px;
            height: 48px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-refresh {
            background: green;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .date-persian {
            background: rgba(57, 177, 209, 0.15);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* کارت آمار */
        .stats-card {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            padding: 18px 28px;
            border-radius: 32px;
        }

        .stat-badge {
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* فیلترها */
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 35px;
            justify-content: center;
        }

        .filter-btn {
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn[data-filter="all"] { background: linear-gradient(135deg, #39B1D1, #2c8dad); color: white; }
        .filter-btn[data-filter="vmess"] { background: linear-gradient(135deg, #D6FB61, #b8e04a); color: #1e293b; }
        .filter-btn[data-filter="vless"] { background: linear-gradient(135deg, #F6850C, #e07a0a); color: white; }
        .filter-btn[data-filter="trojan"] { background: linear-gradient(135deg, #DE3E3E, #c73535); color: white; }
        .filter-btn[data-filter="ss"] { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; }

        .filter-btn.active {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        /* گرید کانفیگ‌ها */
        .configs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .config-item {
            border-radius: 28px;
            padding: 18px;
            transition: all 0.25s ease;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .config-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(57, 177, 209, 0.2);
        }

        .config-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(57, 177, 209, 0.3);
        }

        .protocol-icon {
            font-size: 1.2rem;
        }

        .config-link {
            font-size: 0.73rem;
            font-family: 'Courier New', 'Fira Code', monospace;
            word-break: break-all;
            line-height: 1.5;
            direction: ltr;
            text-align: left;
            padding: 10px;
            border-radius: 16px;
            margin: 10px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-copy, .btn-qr {
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .btn-copy {
            background: rgba(57, 177, 209, 0.15);
            color: inherit;
        }

        .btn-qr {
            background: brown;
            color: white;
        }

        /* مودال QR */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .qr-modal-content {
            background: linear-gradient(135deg, #ffffff, #f0f9ff);
            padding: 30px;
            border-radius: 48px;
            text-align: center;
            max-width: 90%;
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body.dark .qr-modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
        }

        .qr-modal-content h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        #qrCodeContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        #qrCodeContainer canvas,
        #qrCodeContainer img {
            display: block;
            margin: 0 auto;
        }

        .close-modal {
            margin-top: 20px;
            background: linear-gradient(135deg, #DE3E3E, #c73535);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        .load-more-container {
            text-align: center;
            margin: 40px 0 20px;
        }

        .load-more-btn {
            padding: 14px 35px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #0a4e24;
            color: white;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        @media (max-width: 700px) {
            .configs-grid {
                grid-template-columns: 1fr;
            }
            .filter-btn {
                padding: 8px 18px;
                font-size: 0.8rem;
            }
            .stats-card {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="dark">

<div class="container">
    <div class="header">
        <div class="title-section">
            <h1><i class="fas fa-filter"></i> V2Ray Config Hub</h1>
            <p>Hossein.IT</p>
        </div>
        <div class="controls">
            <div class="date-persian" id="persianDate">📅 بارگیری...</div>
            <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
            <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> بروزرسانی</button>
        </div>
    </div>

    <div class="stats-card card">
        <div class="stat-badge"><i class="fas fa-database"></i> مجموع: <span id="totalConfigsCount">0</span></div>
        <div class="stat-badge"><i class="fas fa-eye"></i> نمایش: <span id="displayedCount">0</span></div>
        <div class="stat-badge"><i class="fas fa-filter"></i> فیلتر: <span id="activeFilter">همه</span></div>
        <div class="stat-badge"><i class="fas fa-clock"></i> بروزرسانی: <span id="lastUpdateTime">--</span></div>
    </div>

    <div class="filters-section">
        <button class="filter-btn active" data-filter="all"><i class="fas fa-globe"></i> همه</button>
        <button class="filter-btn" data-filter="vmess"><i class="fas fa-user-secret"></i> Vmess</button>
        <button class="filter-btn" data-filter="vless"><i class="fas fa-bolt"></i> Vless</button>
        <button class="filter-btn" data-filter="trojan"><i class="fas fa-shield-haltered"></i> Trojan</button>
        <button class="filter-btn" data-filter="ss"><i class="fas fa-key"></i> SS / SSR</button>
    </div>

    <div id="configsContainer" class="configs-grid"></div>
    <div id="loadMoreContainer" class="load-more-container" style="display: none;">
        <button class="load-more-btn" id="loadMoreBtn"><i class="fas fa-arrow-down"></i> بارگذاری بیشتر</button>
    </div>
    <footer><i class="fas fa-qrcode"></i> QR کد هر کانفیگ | کلیک روی کادر = کپی خودکار</footer>
</div>

<div id="toastMsg" class="toast-msg">✅ کپی شد!</div>

<div id="qrModal" class="qr-modal">
    <div class="qr-modal-content">
        <h3><i class="fas fa-qrcode"></i> اسکن کنید</h3>
        <div id="qrCodeContainer"></div>
        <button class="close-modal" onclick="closeQRModal()"><i class="fas fa-times"></i> بستن</button>
    </div>
</div>

<script>
    // کد جاوااسکریپت مثل قبل (بدون تغییر)
    const EPODONIOS_COUNT = 67;
    const BARRY_FAR_URLS = [
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/All_Configs_Sub.txt",
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Sub1.txt",
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Sub2.txt",
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Sub3.txt",
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Sub4.txt",
        "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Sub5.txt"
    ];
    
    const PAGE_SIZE = 150;
    
    let allConfigs = [];
    let filteredConfigs = [];
    let currentIndex = 0;
    let currentFilter = "all";
    let isLoading = false;
    
    const configsContainer = document.getElementById('configsContainer');
    const totalConfigsSpan = document.getElementById('totalConfigsCount');
    const displayedCountSpan = document.getElementById('displayedCount');
    const activeFilterSpan = document.getElementById('activeFilter');
    const lastUpdateTimeSpan = document.getElementById('lastUpdateTime');
    const refreshBtn = document.getElementById('refreshBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const persianDateSpan = document.getElementById('persianDate');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    function getProtocolType(config) {
        if (config.startsWith('vmess://')) return 'vmess';
        if (config.startsWith('vless://')) return 'vless';
        if (config.startsWith('trojan://')) return 'trojan';
        if (config.startsWith('ss://') || config.startsWith('shadowsocks://')) return 'ss';
        return 'other';
    }
    
    function toPersianDate(date) {
        try {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year: 'numeric', month: 'long', day: 'numeric' }).format(date);
        } catch(e) {
            return date.toLocaleDateString('fa-IR');
        }
    }
    
    function updatePersianDate() {
        const now = new Date();
        persianDateSpan.innerHTML = `📅 ${toPersianDate(now)} | ${now.toLocaleTimeString('fa-IR')}`;
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 1700);
    }
    
    async function copyToClipboard(text, event) {
        event?.stopPropagation();
        try {
            await navigator.clipboard.writeText(text);
            showToast("✅ کانفیگ کپی شد!");
        } catch {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("✅ کپی شد");
        }
    }
    
    function extractConfigs(text) {
        const lines = text.split(/\r?\n/);
        const prefixes = ['vmess://', 'vless://', 'trojan://', 'ss://', 'shadowsocks://'];
        const configs = [];
        for (let line of lines) {
            line = line.trim();
            if (line && prefixes.some(p => line.startsWith(p))) configs.push(line);
        }
        return configs;
    }
    
    async function fetchEpodonios() {
        const base = "https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/";
        const promises = [];
        for (let i = 1; i <= EPODONIOS_COUNT; i++) {
            promises.push(fetch(`${base}Sub${i}.txt`).then(res => res.ok ? res.text() : null).catch(() => null));
        }
        const results = await Promise.all(promises);
        let all = [];
        for (const txt of results) if (txt) all.push(...extractConfigs(txt));
        return all;
    }
    
    async function fetchBarryFar() {
        const configs = [];
        for (const url of BARRY_FAR_URLS) {
            try {
                const res = await fetch(url);
                if (res.ok) configs.push(...extractConfigs(await res.text()));
            } catch(e) {}
        }
        return configs;
    }
    
    async function loadAllSources() {
        if (isLoading) return;
        isLoading = true;
        configsContainer.innerHTML = `<div class="loading"><i class="fas fa-spinner fa-pulse"></i> دریافت کانفیگ از منابع ...</div>`;
        loadMoreContainer.style.display = 'none';
        
        const [epo, barry] = await Promise.all([fetchEpodonios(), fetchBarryFar()]);
        const combined = [...epo, ...barry];
        const unique = [...new Map(combined.map(c => [c, c])).values()];
        
        allConfigs = unique.map(cfg => ({ text: cfg, type: getProtocolType(cfg) }));
        
        totalConfigsSpan.innerText = allConfigs.length;
        lastUpdateTimeSpan.innerText = new Date().toLocaleTimeString('fa-IR');
        
        applyFilter(currentFilter);
        updatePersianDate();
        isLoading = false;
    }
    
    function applyFilter(filterType) {
        currentFilter = filterType;
        const filterNames = { all: 'همه', vmess: 'Vmess', vless: 'Vless', trojan: 'Trojan', ss: 'SS/SSR' };
        activeFilterSpan.innerText = filterNames[filterType];
        
        if (filterType === 'all') {
            filteredConfigs = [...allConfigs];
        } else {
            filteredConfigs = allConfigs.filter(cfg => cfg.type === filterType);
        }
        
        currentIndex = 0;
        configsContainer.innerHTML = '';
        if (filteredConfigs.length) {
            loadMoreItems();
        } else {
            configsContainer.innerHTML = `<div class="loading">⚠️ کانفیگی با این پروتکل یافت نشد!</div>`;
            loadMoreContainer.style.display = 'none';
        }
    }
    
    function renderConfigItems(configList) {
        let html = '';
        for (let item of configList) {
            const cfg = item.text;
            let iconHtml = '<i class="fas fa-link"></i>';
            let protocol = "OTHER";
            if (cfg.startsWith('vmess://')) { iconHtml = '<i class="fas fa-user-secret"></i>'; protocol="VMESS"; }
            else if (cfg.startsWith('vless://')) { iconHtml = '<i class="fas fa-bolt"></i>'; protocol="VLESS"; }
            else if (cfg.startsWith('trojan://')) { iconHtml = '<i class="fas fa-shield-haltered"></i>'; protocol="TROJAN"; }
            else if (cfg.startsWith('ss://')) { iconHtml = '<i class="fas fa-key"></i>'; protocol="SS"; }
            
            let shortLink = cfg.length > 80 ? cfg.substring(0, 77) + '...' : cfg;
            const escapedCfg = escapeHtml(cfg);
            const escapedShort = escapeHtml(shortLink);
            
            html += `
                <div class="config-item" data-full-config="${escapedCfg}">
                    <div class="config-header">
                        <span class="protocol-icon">${iconHtml}</span>
                        <span style="font-size:0.7rem; font-weight:700;">${protocol}</span>
                    </div>
                    <div class="config-link" dir="ltr">${escapedShort}</div>
                    <div class="button-group">
                        <button class="btn-copy" data-config="${escapedCfg}"><i class="fas fa-copy"></i> کپی</button>
                        <button class="btn-qr" data-qr="${escapedCfg}"><i class="fas fa-qrcode"></i> QR</button>
                    </div>
                </div>
            `;
        }
        return html;
    }
    
    function attachEvents() {
        document.querySelectorAll('.btn-copy').forEach(btn => {
            btn.removeEventListener('click', window._copyH);
            const handler = (e) => {
                e.stopPropagation();
                const cfg = btn.getAttribute('data-config');
                if (cfg) copyToClipboard(cfg, e);
            };
            btn.addEventListener('click', handler);
            btn._copyH = handler;
        });
        
        document.querySelectorAll('.btn-qr').forEach(btn => {
            btn.removeEventListener('click', window._qrH);
            const qrHandler = (e) => {
                e.stopPropagation();
                const cfg = btn.getAttribute('data-qr');
                if (cfg) showQRModal(cfg);
            };
            btn.addEventListener('click', qrHandler);
            btn._qrH = qrHandler;
        });
        
        document.querySelectorAll('.config-item').forEach(item => {
            item.removeEventListener('click', window._itemH);
            const itemHandler = (e) => {
                if (e.target.closest('.btn-copy') || e.target.closest('.btn-qr')) return;
                const full = item.getAttribute('data-full-config');
                if (full) copyToClipboard(full, e);
            };
            item.addEventListener('click', itemHandler);
            item._itemH = itemHandler;
        });
    }
    
    function loadMoreItems() {
        if (currentIndex >= filteredConfigs.length) {
            loadMoreContainer.style.display = 'none';
            return;
        }
        const nextBatch = filteredConfigs.slice(currentIndex, currentIndex + PAGE_SIZE);
        const newHtml = renderConfigItems(nextBatch);
        if (currentIndex === 0) configsContainer.innerHTML = newHtml;
        else configsContainer.insertAdjacentHTML('beforeend', newHtml);
        
        attachEvents();
        currentIndex += nextBatch.length;
        displayedCountSpan.innerText = currentIndex;
        
        if (currentIndex >= filteredConfigs.length) loadMoreContainer.style.display = 'none';
        else loadMoreContainer.style.display = 'block';
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function showQRModal(configLink) {
        const modal = document.getElementById('qrModal');
        const qrContainer = document.getElementById('qrCodeContainer');
        qrContainer.innerHTML = "";
        try {
            new QRCode(qrContainer, {
                text: configLink,
                width: 220,
                height: 220,
                colorDark: "#1e293b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        } catch(e) {
            qrContainer.innerHTML = `<p style="color:red;">خطا در تولید QR</p>`;
        }
        modal.style.display = "flex";
    }
    
    window.closeQRModal = function() {
        document.getElementById('qrModal').style.display = "none";
    };
    
    // فیلترها
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filter = btn.getAttribute('data-filter');
            applyFilter(filter);
        });
    });
    
    // تم (با پیشفرض dark)
    function initTheme() {
        const saved = localStorage.getItem('v2ray-theme-v6');
        if (saved === 'light') {
            document.body.classList.remove('dark');
            document.body.classList.add('light');
            themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }
    }
    
    function toggleTheme() {
        if (document.body.classList.contains('dark')) {
            document.body.classList.remove('dark');
            document.body.classList.add('light');
            localStorage.setItem('v2ray-theme-v6', 'light');
            themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            localStorage.setItem('v2ray-theme-v6', 'dark');
            themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }
    }
    
    async function init() {
        initTheme();
        updatePersianDate();
        setInterval(updatePersianDate, 60000);
        themeToggleBtn.addEventListener('click', toggleTheme);
        refreshBtn.addEventListener('click', async () => { await loadAllSources(); });
        loadMoreBtn.addEventListener('click', () => loadMoreItems());
        await loadAllSources();
    }
    
    init();
</script>
</body>
</html>
